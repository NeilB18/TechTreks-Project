kind: edge
title: One thing stays one thing, with no made-up time; no day means the ideas list; questions and chatter save nothing
seed:
  now: "2027-03-01T12:00:00"
  trip: {id: miami, name: Miami Spring Break, status: PLANNING, destination: Miami,
         start_date: "2027-03-14", end_date: "2027-03-18", base_currency: USD,
         leader: aarav, leader_approval: [member_changes, trip_changes], auto_log_mode: mention_only}
  members:
    - {id: aarav, name: Aarav, handle: "@aarav-venmo"}
    - {id: jake, name: Jake, handle: "@jake-venmo"}
    - {id: mia, name: Mia, handle: "@mia-venmo"}
turns:
  - sender: jake
    text: "@tripbot add Wynwood Walls on Monday"
    expect:
      calls:
        - {name: add_activity, args: {day: "2027-03-15"}}
      forbid: [save_idea]
      messages:
        - {to: group, contains: [Wynwood]}
      end_state:
        - activity_count: 1
        - idea_count: 0
        - activity_at: {name: wynwood, start: "2027-03-15", slot: null}
    golden:
      calls:
        - {name: add_activity, args: {trip_id: miami, name: Wynwood Walls, day: "2027-03-15"}}
      messages:
        - {to: group, text: "Added Wynwood Walls to Monday 🎨"}
  - sender: mia
    text: "@tripbot add Joe's Stone Crab"
    expect:
      calls:
        - {name: save_idea, args: {name: "Joe's Stone Crab"}}
      forbid: [add_activity]
      messages:
        - {to: group, contains: [Joe]}
      end_state:
        - activity_count: 1
        - idea_count: 1
    golden:
      calls:
        - {name: save_idea, args: {trip_id: miami, name: "Joe's Stone Crab"}}
      messages:
        - {to: group, text: "Added Joe's Stone Crab to the ideas list 🦀"}
  - sender: aarav
    text: "@tripbot what's on our ideas list?"
    expect:
      forbid_mutations: true
      messages:
        - {to: group, contains: [Joe]}
      end_state:
        - idea_count: 1
    golden:
      messages:
        - {to: group, text: "Just Joe's Stone Crab so far (Mia's pick)."}
  - sender: jake
    mentioned: false
    text: "we should also hit south beach at some point"
    expect:
      silent: true
      forbid_mutations: true
      end_state:
        - idea_count: 1
        - activity_count: 1
    golden: {}
