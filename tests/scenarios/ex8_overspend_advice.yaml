example: "8"
title: Overspend advice
seed:
  now: "2027-03-16T13:00:00"
  trip: {id: miami, name: Miami Spring Break, status: ACTIVE, destination: Miami,
         start_date: "2027-03-14", end_date: "2027-03-18", base_currency: USD,
         leader: aarav, leader_approval: [member_changes, trip_changes]}
  members:
    - {id: aarav, name: Aarav, handle: "@aarav-venmo"}
    - {id: jake, name: Jake, handle: "@jake-venmo"}
    - {id: mia, name: Mia, handle: "@mia-venmo"}
  budgets:
    mia: {total: 90000, limits: {FOOD: 15000}}
  expenses:
    - {id: e1, paid_by: aarav, amount: 12000, description: Brunch, category: FOOD,
       split_with: [aarav, jake, mia]}
    - {id: e2, paid_by: jake, amount: 21000, description: Dinner, category: FOOD,
       split_with: [aarav, jake, mia]}
    - {id: e3, paid_by: jake, amount: 9000, description: Tacos, category: FOOD,
       split_with: [aarav, jake, mia]}
    - {id: e4, paid_by: mia, amount: 6000, description: Lunch, category: FOOD,
       split_with: [aarav, jake, mia]}
turns:
  - sender: mia
    channel: dm
    text: "I'm over on food aren't I? what should I do"
    expect:
      calls:
        - {name: get_budget_status, args: {person_id: mia}}
        - {name: get_travel_tips}
      forbid_mutations: true
      messages:
        - {to: mia, contains: ["$10", "$740"]}
      no_messages_to: [group]
    golden:
      calls:
        - {name: get_budget_status, args: {trip_id: miami, person_id: mia}}
        - {name: get_travel_tips, args: {trip_id: miami, destination: Miami, multipliers: [0.5]}}
      messages:
        - {to: mia, text: "Yeah, you're $10 over your $150 food limit, but you've still got $740 left overall. Cheaper ideas for the next two days: street food, food trucks and grocery-store breakfasts. Want me to raise your food limit (say to $200) so it matches how you're actually spending?"}
  - sender: mia
    channel: dm
    text: "yeah make it $200"
    expect:
      calls:
        - {name: set_budget, args: {person_id: mia, total: 90000, limits: {FOOD: 20000}}}
      messages:
        - {to: mia, contains: ["$200", "$40"]}
      no_messages_to: [group]
      end_state:
        - budget_total: {mia: 90000}
    golden:
      calls:
        - {name: set_budget, args: {trip_id: miami, person_id: mia, total: 90000, limits: {FOOD: 20000}}}
        - {name: get_budget_status, args: {trip_id: miami, person_id: mia}}
      messages:
        - {to: mia, text: "Done, your food limit is now $200 (total still $900). You've got $40 left for food."}
