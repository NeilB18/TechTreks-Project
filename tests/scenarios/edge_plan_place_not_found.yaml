kind: edge
title: A place the map can't find is added but flagged, and the bot asks if the name is right
seed:
  now: "2027-03-01T12:00:00"
  trip: {id: miami, name: Miami Spring Break, status: PLANNING, destination: Miami,
         start_date: "2027-03-14", end_date: "2027-03-18", base_currency: USD,
         leader: aarav, leader_approval: [member_changes, trip_changes], auto_log_mode: mention_only}
  members:
    - {id: aarav, name: Aarav, handle: "@aarav-venmo"}
    - {id: jake, name: Jake, handle: "@jake-venmo"}
    - {id: mia, name: Mia, handle: "@mia-venmo"}
turns:
  - sender: jake
    text: "@tripbot add Zzqx Imaginary Taco Palace on Monday"
    expect:
      calls:
        - {name: add_activity, args: {day: "2027-03-15", kind: food}}
      forbid: [generate_itinerary]
      messages:
        - {to: group, contains_any: ["couldn't find", "can't find", "could not find", "not find", "double-check", "double check", "right name", "spelled", "spelling"]}
      end_state:
        - activity_count: 1
    golden:
      calls:
        - {name: add_activity, args: {trip_id: miami, name: Zzqx Imaginary Taco Palace, kind: food, day: "2027-03-15"}}
      messages:
        - {to: group, text: "Added Zzqx Imaginary Taco Palace for Monday lunch, but I couldn't find it on the map. Is that the right name?"}
