example: "2a"
title: Date change
seed:
  now: "2027-03-01T12:00:00"
  trip: {id: miami, name: Miami Spring Break, status: BOOKED, destination: Miami,
         start_date: "2027-03-14", end_date: "2027-03-18", base_currency: USD,
         leader: aarav, leader_approval: [member_changes, trip_changes]}
  members:
    - {id: aarav, name: Aarav, handle: "@aarav-venmo"}
    - {id: jake, name: Jake, handle: "@jake-venmo"}
    - {id: mia, name: Mia, handle: "@mia-venmo"}
  expenses:
    - {id: e1, paid_by: aarav, amount: 120000, description: "Airbnb (Mar 14–18)", category: LODGING,
       split_with: [aarav, jake, mia]}
  activities:
    - {id: boat_tour, name: Boat tour, start: "2027-03-15T10:00", est_cost_cents: 13300}
    - {id: beach_day, name: Beach day, start: "2027-03-17", est_cost_cents: 0}
turns:
  - sender: jake
    text: "@tripbot can we push the trip to Mar 16–20? I have a midterm on the 15th"
    expect:
      forbid_mutations: true
      forbid: [update_trip]
      messages:
        - {to: group, contains: [Aarav, boat tour, Airbnb]}
    golden:
      messages:
        - {to: group, text: "Jake wants to move the trip to Mar 16–20. @Aarav, your call as trip lead. If we do, the boat tour (Mar 15) falls outside the new dates, and the Airbnb is booked for Mar 14–18."}
  - sender: aarav
    text: "@tripbot yeah approved, I'll sort the Airbnb"
    expect:
      calls:
        - {name: update_trip, args: {changes: {start_date: "2027-03-16", end_date: "2027-03-20"}}}
      messages:
        - {to: group, contains: [boat tour]}
      end_state:
        - trip: {start_date: "2027-03-16", end_date: "2027-03-20"}
    golden:
      calls:
        - {name: update_trip, args: {trip_id: miami, changes: {start_date: "2027-03-16", end_date: "2027-03-20"}}}
      messages:
        - {to: group, text: "Dates updated to Mar 16–20 ✅ The boat tour (Mar 15) is now outside the trip. Move it to another day or drop it?"}
