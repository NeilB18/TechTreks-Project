kind: edge
title: A reminder with a weekday becomes a dated reminder
seed:
  now: "2027-03-10T12:00:00"
  trip: {id: miami, name: Miami Spring Break, status: PLANNING, destination: Miami,
         start_date: "2027-03-14", end_date: "2027-03-18", base_currency: USD,
         leader: aarav, leader_approval: [member_changes, trip_changes], auto_log_mode: mention_only}
  members:
    - {id: aarav, name: Aarav, handle: "@aarav-venmo"}
    - {id: jake, name: Jake, handle: "@jake-venmo"}
    - {id: mia, name: Mia, handle: "@mia-venmo"}
  expenses:
    - {id: e1, paid_by: aarav, amount: 12000, description: Dinner, category: FOOD, split_with: [aarav, jake, mia]}
turns:
  - sender: aarav
    time: "2027-03-10T12:00 (Wednesday)"
    text: "@tripbot remind everyone to pay me for the Airbnb by Friday"
    expect:
      calls:
        - {name: create_reminder}
      end_state:
        - reminder_due_on: "2027-03-12"
    golden:
      calls:
        - {name: create_reminder, args: {trip_id: miami, message: "Pay Aarav for the Airbnb", due_at: "2027-03-12T10:00", audience: [all]}}
      messages:
        - {to: group, text: "⏰ I'll remind everyone Friday to pay Aarav for the Airbnb."}
