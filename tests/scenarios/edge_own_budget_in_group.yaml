kind: edge
title: Someone asks about their own budget in the group chat
seed:
  now: "2027-03-01T12:00:00"
  trip: {id: miami, name: Miami Spring Break, status: PLANNING, destination: Miami,
         start_date: "2027-03-14", end_date: "2027-03-18", base_currency: USD,
         leader: aarav, leader_approval: [member_changes, trip_changes], auto_log_mode: mention_only}
  members:
    - {id: aarav, name: Aarav, handle: "@aarav-venmo"}
    - {id: jake, name: Jake, handle: "@jake-venmo"}
    - {id: mia, name: Mia, handle: "@mia-venmo"}
  budgets:
    mia: {total: 50000}
  expenses:
    - {id: e1, paid_by: aarav, amount: 90000, description: Airbnb, category: LODGING, split_with: [aarav, jake, mia]}
turns:
  - sender: mia
    text: "@tripbot how much do I have left?"
    expect:
      calls:
        - {name: get_budget_status, args: {person_id: mia}}
      forbid_mutations: true
      messages:
        - {to: mia, contains: ["$200"]}
        - {to: group, contains: ["tripbot.example/trips/miami"], not_contains: ["$200", "$300"]}
      no_messages_to: [jake, aarav]
    golden:
      calls:
        - {name: get_budget_status, args: {trip_id: miami, person_id: mia}}
      messages:
        - {to: group, text: "Mia, it's on your private trip page 🔒 https://tripbot.example/trips/miami"}
        - {to: mia, text: "You've spent $300 of your $500 budget, so $200 left."}
