example: "9"
title: Refunds
seed:
  trip: {id: miami, name: Miami Spring Break, destination: Miami, base_currency: USD,
         leader: aarav, leader_approval: [member_changes, trip_changes]}
  members:
    - {id: aarav, name: Aarav, handle: "@aarav-venmo"}
    - {id: jake, name: Jake, handle: "@jake-venmo"}
    - {id: mia, name: Mia, handle: "@mia-venmo"}
  expenses:
    - {id: e5, paid_by: aarav, amount: 30000, description: Concert tickets, category: ACTIVITIES,
       split_with: [aarav, jake, mia]}
  paybacks:
    - {id: e6, from: jake, to: aarav, amount: 10000}
turns:
  - sender: aarav
    text: "@tripbot concert got moved, got $150 back on the tickets"
    expect:
      forbid_mutations: true
      forbid: [record_refund]
      messages:
        - {to: group, contains: ["$150", "$50"]}
    golden:
      messages:
        - {to: group, text: "Logging a $150 refund on Concert tickets ($300)? That's $50 back per person. Confirm?"}
  - sender: aarav
    text: "@tripbot yep"
    expect:
      calls:
        - {name: record_refund, args: {expense_id: e5, amount: 15000}}
      messages:
        - {to: group, contains: [Mia, Jake, "$50"]}
        - {to: jake, contains: ["$50", Mia]}
      end_state:
        - refund_count: 1
        - balance: {from: mia, to: jake, amount: 5000}
        - no_debts_for: aarav
    golden:
      calls:
        - {name: record_refund, args: {expense_id: e5, amount: 15000, currency: USD, note: Concert moved}}
        - {name: get_balances, args: {trip_id: miami}}
      messages:
        - {to: group, text: "Refund logged 🎟️ $150 back on Concert tickets, $50 per person. To settle up: Mia sends Jake $50 (Venmo: @jake-venmo) and Aarav's all square."}
        - {to: jake, text: "You'd already paid Aarav your $100, so after the refund you're owed $50. Mia's sending it to you directly, so Aarav doesn't need to pay you back."}
