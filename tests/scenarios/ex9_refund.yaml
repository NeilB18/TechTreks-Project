example: "9"
title: Refunds
seed:
  trip: {id: miami, name: Miami Spring Break, destination: Miami, base_currency: USD,
         leader: aarav, leader_approval: [member_changes, trip_changes], auto_log_mode: mention_only}
  members:
    - {id: aarav, name: Aarav, handle: "@aarav-venmo"}
    - {id: jake, name: Jake, handle: "@jake-venmo"}
    - {id: mia, name: Mia, handle: "@mia-venmo"}
  expenses:
    - {id: e5, paid_by: aarav, amount: 30000, description: Concert tickets, category: ACTIVITIES,
       split_with: [aarav, jake, mia]}
    - {id: e6, paid_by: jake, amount: 10000, description: "Jake paid Aarav back (concert)",
       category: SETTLEMENT, splits: {aarav: 10000}}
turns:
  - sender: aarav
    text: "@tripbot concert got moved, got $150 back on the tickets"
    expect:
      forbid_mutations: true
      forbid: [record_refund]
      messages:
        - {to: group, contains: ["$150", "$50"]}
    golden:
      messages:
        - {to: group, text: "Logging a $150 refund on Concert tickets ($300)? That's $50 back per person. Confirm?"}
  - sender: aarav
    text: "@tripbot yep"
    expect:
      calls:
        - {name: record_refund, args: {expense_id: e5, amount: 15000}}
      messages:
        - {to: group, contains: [Mia, "$50"]}
        - {to: aarav, contains: [Jake, "$50"]}
      end_state:
        - refund_count: 1
        - balance: {from: aarav, to: jake, amount: 5000}
        - balance: {from: mia, to: aarav, amount: 5000}
    golden:
      calls:
        - {name: record_refund, args: {expense_id: e5, amount: 15000, currency: USD, note: Concert moved}}
        - {name: get_balances, args: {trip_id: miami}}
      messages:
        - {to: group, text: "Refund logged 🎟️ $150 back on Concert tickets, $50 per person. Mia now owes Aarav $50 (was $100)."}
        - {to: aarav, text: "Jake already paid you his $100, so send him $50 back. Venmo: @jake-venmo"}
