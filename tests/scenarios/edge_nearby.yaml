kind: edge
title: Nearby search uses the saved lodging, gives closest places with distances, and asks when there's no lodging
seed:
  now: "2027-03-01T12:00:00"
  trip: {id: miami, name: Miami Spring Break, status: PLANNING, destination: Miami,
         start_date: "2027-03-14", end_date: "2027-03-18", base_currency: USD,
         leader: aarav, leader_approval: [member_changes, trip_changes], auto_log_mode: mention_only,
         lodging: Freehand Miami}
  members:
    - {id: aarav, name: Aarav, handle: "@aarav-venmo"}
    - {id: jake, name: Jake, handle: "@jake-venmo"}
    - {id: mia, name: Mia, handle: "@mia-venmo"}
turns:
  - sender: jake
    text: "@tripbot can you find close pizza recs near where we're staying?"
    expect:
      calls:
        - {name: find_nearby, args: {what: pizza}}
      forbid_mutations: true
      messages:
        - {to: group, contains: [Pizza Spot 1, mi], not_contains: [best]}
    golden:
      calls:
        - {name: find_nearby, args: {trip_id: miami, what: pizza}}
      messages:
        - {to: group, text: "Closest pizza to the Freehand: Pizza Spot 1 (0.1 mi, about a 3 min walk, open Mo-Su 11:00-23:00), Pizza Spot 2 (0.2 mi, about a 5 min walk), Pizza Spot 3 (0.3 mi, about a 8 min walk). Maps links: https://www.google.com/maps/search/?api=1&query=Pizza+Spot+1%2C+100+Collins+Avenue%2C+Miami (map data © OpenStreetMap contributors)"}
  - sender: mia
    text: "@tripbot any coffee near Wynwood Walls?"
    expect:
      calls:
        - {name: find_nearby, args: {what: coffee, near: Wynwood Walls}}
      forbid_mutations: true
      messages:
        - {to: group, contains: [Coffee Spot 1]}
    golden:
      calls:
        - {name: find_nearby, args: {trip_id: miami, what: coffee, near: Wynwood Walls}}
      messages:
        - {to: group, text: "Closest coffee to Wynwood Walls: Coffee Spot 1 (0.1 mi, about a 3 min walk) and Coffee Spot 2 (0.2 mi). (map data © OpenStreetMap contributors)"}
