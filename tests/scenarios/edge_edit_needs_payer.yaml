kind: edge
title: Editing someone else's expense waits for the payer
seed:
  now: "2027-03-01T12:00:00"
  trip: {id: miami, name: Miami Spring Break, status: PLANNING, destination: Miami,
         start_date: "2027-03-14", end_date: "2027-03-18", base_currency: USD,
         leader: aarav, leader_approval: [member_changes, trip_changes], auto_log_mode: mention_only}
  members:
    - {id: aarav, name: Aarav, handle: "@aarav-venmo"}
    - {id: jake, name: Jake, handle: "@jake-venmo"}
    - {id: mia, name: Mia, handle: "@mia-venmo"}
  expenses:
    - {id: e1, paid_by: aarav, amount: 12000, description: Dinner, category: FOOD, split_with: [aarav, jake, mia]}
turns:
  - sender: jake
    text: "@tripbot the dinner was actually $150 not $120"
    expect:
      forbid: [edit_expense]
      forbid_mutations: true
      messages:
        - {to: group, contains: [Aarav]}
    golden:
      messages:
        - {to: group, text: "Jake says Dinner was $150, not $120. @Aarav, you paid. Should I change it? That'd be $50 each."}
  - sender: aarav
    text: "@tripbot yep that's right"
    expect:
      calls:
        - {name: edit_expense, args: {expense_id: e1, changes: {amount: 15000}}}
      end_state:
        - balance: {from: jake, to: aarav, amount: 5000}
    golden:
      calls:
        - {name: edit_expense, args: {expense_id: e1, requested_by: jake, changes: {amount: 15000}}}
      messages:
        - {to: group, text: "Updated: Dinner is now $150, $50 each. Jake and Mia owe Aarav $50 each, pay @aarav-venmo"}
