kind: edge
title: Putting an idea on a day uses the idea and takes it off the ideas list
seed:
  now: "2027-03-01T12:00:00"
  trip: {id: miami, name: Miami Spring Break, status: PLANNING, destination: Miami,
         start_date: "2027-03-14", end_date: "2027-03-18", base_currency: USD,
         leader: aarav, leader_approval: [member_changes, trip_changes], auto_log_mode: mention_only}
  members:
    - {id: aarav, name: Aarav, handle: "@aarav-venmo"}
    - {id: jake, name: Jake, handle: "@jake-venmo"}
    - {id: mia, name: Mia, handle: "@mia-venmo"}
  ideas:
    - {name: Wynwood Walls, kind: activity, suggested_by: mia}
turns:
  - sender: jake
    text: "@tripbot let's do Wynwood on Monday"
    expect:
      calls:
        - {name: add_activity, args: {day: "2027-03-15"}}
      forbid: [generate_itinerary]
      end_state:
        - activity_count: 1
        - idea_count: 0
    golden:
      calls:
        - {name: add_activity, args: {trip_id: miami, idea_id: i1, day: "2027-03-15"}}
      messages:
        - {to: group, text: "Wynwood Walls is on Monday at 10am (Mia's idea). Maps: https://www.google.com/maps/search/?api=1&query=Wynwood+Walls%2C+Miami"}
